openapi: 3.0.3
info:
  title: Labels
  description: |
    Contact Us: [USPS API Support](https://emailus.usps.com/s/usps-APIs) | [Terms of Service](https://about.usps.com/termsofuse.htm)

    The Labels API is used to create and manage domestic and international shipping labels with tracking numbers and postage barcodes.
    
    Payment requires an active Enterprise Payment System (EPS) account or approved permit / meter.
  version: 3.2.1
servers:
  - url: https://apis.usps.com/labels/v3
    description: Production Environment Endpoint
  - url: https://apis-tem.usps.com/labels/v3
    description: Testing Environment Endpoint
paths:
  /label:
    post:
      tags:
        - Labels
      summary: Create a domestic shipping label
      description: Generates a domestic shipping label PDF or thermal format, charges the associated payment account (EPS), and returns tracking information.
      operationId: createDomesticLabel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLabelRequest'
      responses:
        '200':
          description: Label created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
components:
  schemas:
    CreateLabelRequest:
      type: object
      required:
        - imageInfo
        - toAddress
        - fromAddress
        - packageDescription
      properties:
        imageInfo:
          type: object
          required:
            - imageType
            - labelType
          properties:
            imageType:
              type: string
              enum: [PDF, ZPL203, ZPL300, PNG, SVG]
              default: PDF
            labelType:
              type: string
              enum: [4X6LABEL, 4X4LABEL, 8.5X11LABEL]
              default: 4X6LABEL
            shipmentNotification:
              type: boolean
              default: false
        toAddress:
          $ref: '#/components/schemas/AddressPayload'
        fromAddress:
          $ref: '#/components/schemas/AddressPayload'
        packageDescription:
          type: object
          required:
            - mailClass
            - weight
          properties:
            mailClass:
              type: string
              enum:
                - USPS_GROUND_ADVANTAGE
                - PRIORITY_MAIL
                - PRIORITY_MAIL_EXPRESS
                - PARCEL_SELECT
                - MEDIA_MAIL
                - LIBRARY_MAIL
            weight:
              type: number
              description: Weight in pounds
            dimensions:
              type: object
              properties:
                length:
                  type: number
                width:
                  type: number
                height:
                  type: number
            rateIndicator:
              type: string
              example: SP
            processingCategory:
              type: string
              enum: [MACHINABLE, NONSTANDARD]
            extraServices:
              type: array
              items:
                type: integer
        payment:
          type: object
          properties:
            paymentType:
              type: string
              enum: [EPS, PERMIT, METER]
              default: EPS
            accountNumber:
              type: string
              description: EPS account number or Permit identifier
    AddressPayload:
      type: object
      required:
        - firstName
        - lastName
        - streetAddress
        - city
        - state
        - ZIPCode
      properties:
        firstName:
          type: string
        lastName:
          type: string
        firm:
          type: string
        streetAddress:
          type: string
        secondaryAddress:
          type: string
        city:
          type: string
        state:
          type: string
        ZIPCode:
          type: string
        ZIPPlus4:
          type: string
        phone:
          type: string
        email:
          type: string
    LabelResponse:
      type: object
      properties:
        trackingNumber:
          type: string
          example: "9400111899223191234567"
        labelBrokerID:
          type: string
        labelImage:
          type: string
          description: Base64-encoded label file content (PDF/PNG/ZPL)
        totalBasePrice:
          type: number
          example: 7.65
        routingCode:
          type: string
        carrierRoute:
          type: string
